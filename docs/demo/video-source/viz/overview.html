<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nine graphs</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="viz.css">
<style>
  #hdr { position: absolute; left: 24px; right: 24px; top: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  #hdr h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
  #hdr h1 b { color: var(--gold); }
  #hdr .src { font-family: var(--mono); font-size: 17px; color: var(--muted); }
  #grid { position: absolute; left: 24px; top: 60px; width: 1232px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 202px); gap: 12px 16px; }
  .gc { position: relative; background: linear-gradient(180deg, #151d30, #101726); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px 8px; overflow: hidden; opacity: 0; transform: translateY(14px) scale(.985); transition: opacity .5s ease, transform .5s ease, border-color .6s; }
  .gc.in { opacity: 1; transform: none; }
  .gc.lit { border-color: #3a4d73; }
  .gc .t { display: flex; align-items: baseline; justify-content: space-between; }
  .gc .id { font-family: var(--mono); font-size: 23px; font-weight: 800; color: var(--gold); }
  .gc .aid { font-family: var(--mono); font-size: 15px; color: var(--dim); }
  .gc .d { font-size: 15.5px; line-height: 1.2; color: #c3cde2; margin-top: 2px; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .gc .f { font-family: var(--mono); font-size: 14.5px; color: #e9c46a; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 19px; }
  .gc svg { position: absolute; left: 14px; bottom: 4px; width: 372px; height: 120px; overflow: visible; }
  .gc svg .node, .gc svg .edge, .gc svg .group-box { transition: opacity .45s ease; }
  .gc svg.pre .node, .gc svg.pre .edge, .gc svg.pre .group-box { opacity: 0; }
  #foot { position: absolute; left: 24px; right: 24px; bottom: 6px; text-align: center; font-size: 16px; color: var(--dim); display: none; }
</style>
</head>
<body>
  <div id="hdr"><h1>Nine <b>LangGraph</b> graphs, one local server</h1><div class="src">GET /assistants/search · GET /assistants/{id}/graph</div></div>
  <div id="grid"></div>
  <script type="module" src="overview.js"></script>
</body>
</html>
