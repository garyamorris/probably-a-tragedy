[project]
name = "tragedy"
version = "0.1.0"
description = "Probably a Tragedy: a puppet-theatre game built as a multi-graph LangGraph application (Studio-ready, fully playable offline)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.2",
    "langgraph-sdk>=0.4",
    "langgraph-cli[inmem]>=0.4.42",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-anthropic>=1.7",
    "langsmith>=0.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "langchain-openai>=1.7.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.7"]

# `langgraph dev` puts the config dir on sys.path but NOT src/, so the project must be an installable package.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tragedy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider -p no:langsmith_plugin"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: spawns a real `langgraph dev` server (offline, loopback only)", "live: calls a real model provider (opt-in)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003", "RUF005", "SIM108", "RUF046"]
